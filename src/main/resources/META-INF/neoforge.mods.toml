modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    description='''
${mod_description}
'''

# NeoForge dependency (required)
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

# Minecraft dependency (required)
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Simulated dependency (required — this mod is an addon for Simulated)
[[dependencies.${mod_id}]]
    modId="simulated"
    type="required"
    versionRange="[1,)"
    ordering="AFTER"
    side="BOTH"

[[mixins]]
    config="tabletnav.mixins.json"
